repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy src tests
        language: system
        pass_filenames: false
